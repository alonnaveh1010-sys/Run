<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ריצה עד הגיוס</title>
<meta name="theme-color" content="#0A1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="עד הגיוס">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&family=Secular+One&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first column. Hero countdown with track-lane motif, week strip, readiness check-in, colour-coded session cards, fixed bottom tab bar. */
:root{
  --bg:#0A1020; --bg2:#0E1630; --surface:#131C36; --surface2:#1B2748; --fg:#EEF2FF; --muted:#8E9BC0; --line:#27355F;
  --accent:#FFB627; --accent-ink:#1A1200; --accent-text:#FFB627;
  --q:#FF5C8A; --e:#3FD7B5; --l:#5E9BFF; --s:#A98CFF; --y:#E58BD8;
  --ok:#47D98A; --warn:#FFB627; --bad:#FF5A5F;
  --font-display:'Secular One','Heebo',system-ui,sans-serif;
  --font-body:'Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-data:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#EEF1FA; --bg2:#E4E9F7; --surface:#FFFFFF; --surface2:#E6EBF8; --fg:#0D1530; --muted:#556088; --line:#D3DAEE;
  --accent-text:#A85F00;
  --q:#D4235F; --e:#0C8F78; --l:#2B67DC; --s:#7650DD; --y:#B0309F;
  --ok:#13823F; --warn:#A85F00; --bad:#C8303A; color-scheme:light;
  --theme:#EEF1FA}}
:root[data-theme="light"]{
  --bg:#EEF1FA; --bg2:#E4E9F7; --surface:#FFFFFF; --surface2:#E6EBF8; --fg:#0D1530; --muted:#556088; --line:#D3DAEE;
  --accent-text:#A85F00;
  --q:#D4235F; --e:#0C8F78; --l:#2B67DC; --s:#7650DD; --y:#B0309F;
  --ok:#13823F; --warn:#A85F00; --bad:#C8303A; color-scheme:light;
  --theme:#EEF1FA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;touch-action:manipulation}
#app{max-width:640px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
h2{font-size:1.35rem} h3{font-size:1.15rem;line-height:1.2}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.mono,.exs,.pill,.stats b,.hstats b,.sl output,.zmeta .mono,.ld input{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)} .small{font-size:.8125rem}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px 18px 46px;background:linear-gradient(140deg,var(--surface2),var(--surface) 75%);border:1px solid var(--line);min-height:150px}
.lanes{position:absolute;inset-inline-end:-60px;bottom:-130px;width:290px;height:170px;pointer-events:none}
.lanes i{position:absolute;border-radius:999px;border:3px solid;opacity:.38}
.lanes i:nth-child(1){inset:0;border-color:var(--q)}
.lanes i:nth-child(2){inset:15px;border-color:var(--l)}
.lanes i:nth-child(3){inset:30px;border-color:var(--e)}
.lanes i:nth-child(4){inset:45px;border-color:var(--s)}
.hero-in{position:relative;display:grid;gap:2px}
.eyebrow{font-size:.8125rem;letter-spacing:.04em;color:var(--muted)}
.big{font-family:var(--font-display);font-size:5.4rem;line-height:.95;color:var(--accent-text)}
.big small{font-size:1.25rem;color:var(--fg);margin-inline-start:8px}
.hstats{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap}
.hstats div{display:grid}
.hstats b{font-family:var(--font-data);font-size:1.15rem;font-weight:600}
.hstats span{font-size:.75rem;color:var(--muted)}

/* week strip */
.wknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px}
.wknav button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.wknav button:disabled{opacity:.35}
.wknav div{text-align:center;font-weight:700}
.wknav small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dchip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 0 7px;display:grid;justify-items:center;gap:3px;min-width:0}
.dchip .wl{font-size:.7rem;color:var(--muted)}
.dchip .dn{font-family:var(--font-data);font-weight:600;font-size:1.05rem}
.dchip .dots{display:flex;gap:3px;height:8px}
.dchip .dots i{width:8px;height:8px;border-radius:50%;border:2px solid var(--c);background:transparent}
.dchip .dots i.on{background:var(--c)}
.dchip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dchip.sel .wl{color:var(--accent-ink);opacity:.75}
.dchip.sel .dots i{border-color:var(--accent-ink)}
.dchip.sel .dots i.on{background:var(--accent-ink)}
.dchip.today{box-shadow:0 0 0 2px var(--fg) inset}
.dchip.off{opacity:.55}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.dtitle{margin:18px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.banner{border-radius:14px;padding:11px 13px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 50%,var(--line));font-size:.875rem}
.banner.info{background:color-mix(in srgb,var(--l) 14%,var(--surface));border-color:color-mix(in srgb,var(--l) 50%,var(--line))}
.banner.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface));border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:800;min-height:42px}

/* check-in */
.ci-head{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:6px}
.ring{width:104px;height:104px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:2.1rem}
.z-green{--zc:var(--ok)} .z-yellow{--zc:var(--warn)} .z-red{--zc:var(--bad)}
.zlabel{font-family:var(--font-display);font-size:1.15rem;color:var(--zc)}
.sliders{display:grid;gap:14px;margin-top:8px}
.sl label{display:flex;justify-content:space-between;align-items:baseline;font-weight:500;margin-bottom:2px}
.sl output{font-family:var(--font-data);font-weight:600;color:var(--accent-text)}
.sl input[type=range]{direction:ltr;-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
.sl input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:linear-gradient(to right,var(--accent) var(--pct,50%),var(--surface2) var(--pct,50%))}
.sl input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:var(--surface2)}
.sl input[type=range]::-moz-range-progress{height:10px;border-radius:6px;background:var(--accent)}
.sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--fg);border:4px solid var(--accent);margin-top:-9px;box-shadow:0 2px 8px #0006}
.sl input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--fg);border:4px solid var(--accent)}
.sl .ends{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);direction:ltr}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 13px;font-size:.8125rem;min-height:36px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}

/* session */
.sess{--c:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.sess.q{--c:var(--q)} .sess.e{--c:var(--e)} .sess.l{--c:var(--l)} .sess.s{--c:var(--s)} .sess.y{--c:var(--y)}
.sh{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 26%,var(--surface)),color-mix(in srgb,var(--c) 6%,var(--surface)))}
.ico{width:44px;height:44px;border-radius:14px;background:var(--c);color:#0A1020;display:grid;place-items:center}
.ico svg{width:24px;height:24px}
.tag{font-size:.75rem;font-weight:800;letter-spacing:.05em;color:var(--c)}
.when{font-size:.75rem;color:var(--muted)}
.sb{padding:14px 16px 16px;display:grid;gap:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats.s4{grid-template-columns:repeat(4,1fr);gap:6px}
.stats.s4 b{font-size:.8rem;white-space:nowrap;letter-spacing:-.02em}
.stats div{background:var(--surface2);border-radius:12px;padding:9px 6px;text-align:center;min-width:0}
.stats b{display:block;font-family:var(--font-data);font-weight:600;font-size:1rem;color:var(--fg)}
.stats span{font-size:.7rem;color:var(--muted)}
.adapt{background:color-mix(in srgb,var(--zc) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--zc) 55%,var(--line));border-radius:12px;padding:9px 12px;font-size:.8125rem}
.adapt b{color:var(--zc)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.steps li{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;font-size:.9rem}
.steps li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:7px}
.viz{width:100%;height:auto;display:block;direction:ltr}
.done{display:flex;align-items:center;gap:10px;font-size:.875rem;color:var(--muted);padding-top:4px}
.done input{width:22px;height:22px;accent-color:var(--c)}
.struck{opacity:.5;text-decoration:line-through}
.prog{font-size:.8125rem;color:var(--muted);border-inline-start:3px solid var(--c);padding-inline-start:10px}
.ex{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:6px}
.ex:first-of-type{border-top:0;padding-top:0}
.exh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.exn{font-weight:700}
.exn em{font-style:normal;font-size:.65rem;font-weight:800;background:var(--surface2);color:var(--c);border-radius:6px;padding:1px 6px;margin-inline-start:6px}
.exs.yt{direction:rtl;unicode-bidi:isolate;font-size:.9rem}
.exs{font-family:var(--font-data);font-weight:600;color:var(--c);white-space:nowrap;font-size:1.02rem}
.exm{display:flex;gap:6px;flex-wrap:wrap}
.pill.rest{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface2));font-weight:600}
.pill{font-family:var(--font-data);font-size:.72rem;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:2px 8px}
.cue{font-size:.8125rem;color:var(--muted)}
.ld{display:flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--muted)}
.ld input{width:5.5rem;font-size:16px;font-family:var(--font-data);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:38px;color:var(--fg)}
.ld .hint{font-size:.75rem}

/* tables, charts */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.8125rem}
th,td{padding:9px 6px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end;height:170px;position:relative;padding-top:10px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:5px;position:relative;z-index:1}
.bar i{display:block;width:100%;background:linear-gradient(to top,var(--l),var(--e));border-radius:8px 8px 3px 3px;opacity:.7}
.bar.cur i{opacity:1}
.bar span{font-family:var(--font-data);font-weight:600}
.cap{position:absolute;inset-inline:0;border-top:2px dashed var(--bad);z-index:0;opacity:.8}
.cap em{position:absolute;inset-inline-end:0;top:-1.45em;font-style:normal;font-size:.7rem;color:var(--bad)}
.blabels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center;font-size:.75rem;color:var(--muted);margin-top:6px}
.zrow{display:grid;grid-template-columns:2.2rem 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.zrow:last-child{border-bottom:0}
.zb{width:2.2rem;height:2.2rem;border-radius:10px;display:grid;place-items:center;font-family:var(--font-data);font-weight:600;color:#0A1020;background:var(--zcol)}
.zt{position:relative;height:8px;border-radius:4px;background:var(--surface2);margin:6px 0 4px;direction:ltr}
.zt i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--zcol)}
.zmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field input[type=number]{width:6rem;font-size:16px;font-family:var(--font-data);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:42px;color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpis div{background:var(--surface2);border-radius:14px;padding:12px}
.kpis b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.5rem}
.kpis span{font-size:.75rem;color:var(--muted)}
.wrow{display:grid;gap:3px;padding:12px 0;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:0}
.wrow b{font-family:var(--font-display);font-weight:400}

.why,.log{border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.why summary,.log summary{list-style:none;cursor:pointer;padding:11px 12px;font-weight:700;font-size:.875rem;display:flex;justify-content:space-between;align-items:center;color:var(--c)}
.why summary::-webkit-details-marker,.log summary::-webkit-details-marker{display:none}
.why summary::after,.log summary::after{content:"+";font-family:var(--font-data);font-size:1.15rem}
.why[open] summary::after,.log[open] summary::after{content:"\2212"}
.why p{margin:0;padding:0 12px 12px;font-size:.875rem}
.lg{padding:0 12px 12px;display:grid;gap:10px}
.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lgrid label{display:grid;gap:3px;font-size:.75rem;color:var(--muted)}
.lgrid input{width:100%;font-size:16px;font-family:var(--font-data);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px;color:var(--fg);direction:ltr;text-align:start}
.an{border-radius:12px;padding:10px 12px;font-size:.875rem;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));display:grid;gap:6px}
.an b{color:var(--c)}
.an ul{margin:0;padding-inline-start:18px;display:grid;gap:4px}

/* moves, sheet, coach, history */
.mvnote{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lnk{background:none;border:0;color:var(--accent-text);font-weight:700;text-decoration:underline;padding:0;min-height:0}
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:#000a}
#sheet[hidden]{display:none}
.sheetc{background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
.sheetc h3{font-size:1.2rem}
.dayrow{display:grid;grid-template-columns:3.2rem 1fr;gap:10px;align-items:center;width:100%;text-align:start;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:10px 12px;min-height:52px}
.dayrow[disabled]{opacity:.38}
.dayrow .dd{font-family:var(--font-data);font-weight:600;text-align:center;line-height:1.1}
.dayrow .dd small{display:block;font-family:var(--font-body);font-weight:400;color:var(--muted);font-size:.7rem}
.dayrow .dc{font-size:.85rem}
.dayrow .dc em{font-style:normal;color:var(--muted);font-size:.75rem;display:block}
.dayrow.cur{border-color:var(--accent)}
.optb{width:100%;text-align:start;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px;font-weight:600;min-height:48px}
.optb[disabled]{opacity:.4}
.wl{display:grid;gap:6px}
.wl li{font-size:.85rem}
#toast{position:fixed;bottom:calc(86px + env(safe-area-inset-bottom,0px));left:0;right:0;margin:auto;width:max-content;max-width:90%;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-weight:700;font-size:.875rem}
#toast[hidden]{display:none}
.coach{--tc:var(--ok);border-radius:14px;padding:12px 14px;background:color-mix(in srgb,var(--tc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--tc) 45%,var(--line));display:grid;gap:9px;font-size:.9rem;line-height:1.55}
.coach.tone-ok{--tc:var(--l)} .coach.tone-warn{--tc:var(--warn)} .coach.tone-bad{--tc:var(--bad)}
.coach .chead{display:flex;gap:8px;align-items:center}
.coach .chead b{font-family:var(--font-display);font-weight:400;font-size:1.05rem;line-height:1.25}
.coach .cdot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--tc)}
.coach p{margin:0}
.coach .cnext{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:4px}
.coach .cnext b{color:var(--tc);font-size:.8rem;letter-spacing:.04em}
.coach .cm{font-size:.72rem;color:var(--muted)}
.rv{display:flex;gap:5px}.rv .rc{flex:1;min-width:0}
.rc{background:var(--surface2);border-radius:10px;padding:6px 4px;text-align:center;border-bottom:3px solid var(--ok)}
.rc.slow{border-color:var(--warn)} .rc.fast{border-color:var(--q)}
.rc b{font-family:var(--font-data);display:block;direction:ltr;font-size:.95rem}
.rc span{display:block;font-size:.62rem;color:var(--muted);line-height:1.25;white-space:nowrap}
.rps{display:grid;gap:6px}
.rps .rr{display:grid;grid-template-columns:26px 1fr 1fr;gap:8px;align-items:center}
.rps .rr i{font-style:normal;font-family:var(--font-data);font-weight:600;color:var(--c);text-align:center}
.rps .rr.rh{font-size:.72rem;color:var(--muted)}
.rps input{width:100%;font-size:16px;font-family:var(--font-data);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;color:var(--fg);direction:ltr;text-align:start}
.lsub{font-size:.75rem;color:var(--muted);font-weight:700}
.hist{border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
.hist summary{list-style:none;cursor:pointer;padding:11px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.hist summary::-webkit-details-marker{display:none}
.hist .hd{width:10px;height:10px;border-radius:50%;background:var(--c)}
.hist .ht b{display:block;font-size:.92rem}
.hist .ht span{font-size:.75rem;color:var(--muted)}
.hist .hs{font-family:var(--font-data);font-size:.78rem;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.hist .hb{padding:0 12px 12px}
.dgroup{display:grid;gap:8px}
.dgroup>h3{font-size:1rem;color:var(--muted)}
.lastw summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.lastw summary::-webkit-details-marker{display:none}
.lastw .cdot{width:12px;height:12px;border-radius:50%;background:var(--tc,var(--ok))}
.lastw .lt small{display:block;color:var(--muted);font-size:.72rem}
.lastw .lt b{font-size:.92rem}
.lastw .lb{margin-top:10px}
textarea.bk{width:100%;min-height:90px;font-size:13px;font-family:var(--font-data);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--fg);direction:ltr}
.btn.sec{background:var(--surface2);color:var(--fg);border:1px solid var(--line)}
.fchips{display:grid;gap:5px}
/* bottom nav */
#nav{position:fixed;inset-inline:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
#nav button{background:none;border:0;display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:.7rem;font-weight:500;border-radius:12px}
#nav button svg{width:24px;height:24px}
#nav button[aria-selected="true"]{color:var(--accent-text);font-weight:800}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:no-preference){
  .ring circle.v{transition:stroke-dashoffset .4s ease,stroke .25s}
  .sess{animation:rise .25s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>

function bases(){if(!_bc){_bc=[];for(var i=0;i<=LAST;i++)_bc.push(basePlan(dateOf(i)));}return _bc;}
function dateFromKey(k){var m=k.split('-');return new Date(+m[0],+m[1]-1,+m[2],12);}
function baseItems(b){
  var a=[];b.runs.forEach(function(r){a.push({t:'run',o:r});});
  if(b.str)a.push({t:'str',o:b.str});
  if(b.mob)a.push({t:'mob',o:{id:'MOB',cls:'s',kind:'mob',title:'מוביליטי'}});
  if(b.roll)a.push({t:'roll',o:{id:'ROLL',cls:'s',kind:'roll',title:'גלגול רגליים'}});
  if(b.yoga)a.push({t:'yoga',o:b.yoga});

function movable(b){return b.kind!=='travel'&&b.kind!=='enlist';}
function composed(){
  if(_pc)return _pc;
  var B=bases(),pl=S.place||{},out=[],i;
  for(i=0;i<=LAST;i++){var b=B[i];out.push({d:b.d,wi:b.wi,kind:b.kind,travel:b.travel,note:b.note,runs:[],strs:[],mob:null,roll:null,yoga:null,carry:false,chg:false});}
  for(i=0;i<=LAST;i++){
    if(!movable(B[i]))continue;
    var bk=key(B[i].d);
    baseItems(B[i]).forEach(function(it){
      var o=it.o,ti=i,tk=pl[bk+':'+o.id];
      if(tk){var x=offset(dateFromKey(tk));if(x>=0&&x<=LAST&&movable(B[x]))ti=x;}
      var dst=out[ti];
      if((it.t==='mob'||it.t==='roll'||it.t==='yoga')&&dst[it.t]&&ti!==i)ti=i,dst=out[i];
      o.from=bk;o.moved=ti!==i;o.wi=B[i].wi;
      if(ti!==i){dst.chg=true;out[i].chg=true;}
      if(it.t==='run')dst.runs.push(o);else if(it.t==='str')dst.strs.push(o);else dst[it.t]=o;
    });
  }
  for(i=0;i<=LAST;i++){var p=out[i];
    var has=p.runs.length||p.strs.length||p.mob||p.roll||p.yoga;
    if(p.kind!=='travel'&&p.kind!=='enlist')p.kind=has?'train':'rest';
    if(p.chg)p.note=has?'היום הותאם לפי ההזזות שלך.':'יום מנוחה אחרי ההזזה.';
  }
  for(i=1;i<=LAST;i++){if(out[i].runs.some(function(r){return r.id==='Q';})&&out[i-1].runs.some(function(r){return r.id==='L';}))out[i].carry=true;}
  _pc=out;return out;
}
function dayPlan(d){var o=offset(d);if(o>=0&&o<=LAST)return composed()[o];return{d:d,wi:clamp(Math.floor(o/7),0,3),runs:[],strs:[],kind:'rest',note:'',mob:null,roll:null,yoga:null,carry:false};}

function weekProgress(wi){var tot=0,dn=0;for(var i=0;i<7;i++){var d=addDays(START,wi*7+i);if(d>END)break;var p=dayPlan(d),s=S.done[key(d)]||{};sessList(p).forEach(function(x){tot++;if(s[x.id])dn++;});}return[dn,tot];}

var DEFCI={e:8,s:2,sl:7.5,st:2,p:0,pw:'',alc:false};
function getCI(k){return Object.assign({},DEFCI,S.ci[k]||{});}
function readiness(c){
  var sleep=clamp((c.sl-4)/4,0,1)*100;
  var sc=0.30*c.e*10+0.25*sleep+0.25*(10-c.s)*10+0.20*(10-c.st)*10;
  if(c.alc)sc-=12;
  sc=Math.round(clamp(sc,0,100));
  var z=sc>=75?'green':sc>=55?'yellow':'red';
  if(c.alc&&z==='green')z='yellow';
  var why=[];
  if(c.sl<6.5)why.push('שינה קצרה ('+c.sl+' ש׳)');
  if(c.e<=5)why.push('אנרגיה נמוכה');
  if(c.s>=6)why.push('כאב שרירים');
  if(c.st>=7)why.push('לחץ גבוה');
  if(c.alc)why.push('אלכוהול אתמול');
  return{score:sc,zone:z,why:why};
}
var ZTXT={green:'ירוק · לפי התוכנית',yellow:'צהוב · מורידים עומס',red:'אדום · התאוששות'};
var LOWER=['רגל','ברך','אכילס/קרסול','מפשעה'];
function related(kind,pw){
  if(!pw||pw==='אחר')return true;
  if(LOWER.indexOf(pw)>=0)return kind==='run'||kind==='legs'||kind==='ath';
  if(pw==='כתף/מרפק')return kind==='u'||kind==='ath';
  if(pw==='גב')return kind==='legs'||kind==='ath'||kind==='u';
  return true;
}
function modeFor(kind,rd,c,extra){
  var m=rd.zone==='green'?null:rd.zone, msg='';
  var rank={null:0,yellow:1,red:2};
  function up(x,t){if(rank[x]>rank[m]){m=x;msg=t||'';}}
  if(c.p>=6&&related(kind,c.pw))up('red','כאב'+(c.pw?' ב'+c.pw:'')+' ברמה '+c.p+'. מדלגים על האימון הזה. הליכה קלה או מוביליטי בלבד. אם זה נמשך יותר מ-3 ימים, כדאי לבדוק עם פיזיותרפיסט.');
  else if(c.p>=4&&related(kind,c.pw))up('yellow','כאב'+(c.pw?' ב'+c.pw:'')+' ברמה '+c.p+'. מקלים ומונעים עומס על האזור.');
  if(c.s>=7&&(kind==='legs'||kind==='ath'))up('red','כאב שרירים גבוה. מחליפים באימון קל לפלג גוף עליון או 20 דק׳ מוביליטי.');
  if(extra==='carry')up('yellow','הארוכה הייתה אתמול. האיכות בקצה האיטי, חימום ארוך יותר.');
  return{mode:m,msg:msg};
}

  var s1=dur!=null?(dur>=it.min*0.8?'עשית '+dur+' דק׳ מתוך '+it.min+' מתוכננות, מה שמספיק לשינוי אמיתי בטווח התנועה.':'עשית '+dur+' דק׳ מתוך '+it.min+'. גם זה נחשב, אבל סשן שלם מעמיק את הפתיחה.'):'סשן היוגה נרשם.';
  if(dur!=null&&dur<it.min*0.8)tone='ok';
  P.push(s1);
  var map={'ירכיים':'הירכיים הכי מתוחות. בפעם הבאה מוסיפים דקה לפסואס וליונה, ובימי ריצה קלה עושים 60 שנ׳ פסואס לכל צד לפני.','שוקיים':'השוקיים הכי מתוחות, וזה אופייני לרץ. מוסיפים כלב מביט מטה עם דריכה גם אחרי ריצות קלות, ושוקיים בגלגול ביום רביעי.','גב תחתון':'הגב התחתון מתוח. חתול-פרה ותנוחת ילד של 2 דקות בבוקר יעזרו, ולפני הרמות כבדות שווה חימום נוסף. אם זה מלווה בכאב, סמן בצ׳ק-אין.','כתפיים':'הכתפיים הכי מתוחות, כנראה מהמתח והמקבילים. אחרי כל אימון כוח עליון עושים דקה של פתיחת חזה על דלת.','בסדר בכל מקום':'אין מקום מתוח במיוחד, סימן שהגוף מתאושש טוב בשבוע הזה.'};
  if(tg&&map[tg]){P.push(map[tg]);if(tg==='גב תחתון')tone=worse(tone,'ok');}
  if(fl===4||fl===5)P.push('כתבת שהסשן הרגיש '+FEEL[fl-1]+'. ביוגה זה לרוב סימן לעייפות כללית, אז הקדם שינה ושתייה לפני יום ראשון.');
  var wl=weekLine(c);if(wl)P.push(wl);
  var head=tone==='good'?pick(['סשן התאוששות טוב','הגוף קיבל את מה שהוא צריך'],seed):'סשן טוב, שווה להעמיק בפעם הבאה';
  return mk(head,tone,P,tomorrow(c,''),'',dur!=null?dur+' דק׳':'');
}
function coachFor(it,k,wi){
  var v=(S.log[k]&&S.log[k][it.id])||{};
  if(!hasData(v))return null;
  var c=ctxOf(k);
  try{
    if(it.kind==='run')return it.q?coachQ(it,v,c,k,wi):coachRun(it,v,c,k,wi);
    if(it.kind==='yoga')return coachYoga(it,v,c,k,wi);
    return coachStr(it,v,c,k,wi);
  }catch(e){return mk('נרשם','ok',['הנתונים נשמרו. לא הצלחתי לנתח אותם כרגע, ואפשר לשלוח לי אותם בצ׳אט לניתוח.'],'');}
}
function coachBody(cf){
  return '<div class="chead"><span class="cdot"></span><b>'+cf.head+'</b></div>'+cf.extra+cf.P.map(function(x){return '<p>'+x+'</p>';}).join('')+(cf.next?'<div class="cnext"><b>מכאן והלאה</b><p>'+cf.next+'</p></div>':'')+'<div class="cm">לניתוח עמוק יותר מ-Garmin (פיצולים, דופק לאורך הזמן), כתוב לי בצ׳אט "תנתח".</div>';
}
function analysisHTML(it,k,wi){

  return '<div class="coach tone-'+cf.tone+'">'+coachBody(cf)+'</div>';

    if(it.id==='E2')g+='<div class="lsub">מתגברות (סטרייד)</div><div class="lgrid">'+f('sn','כמה ביצעת (מתוך 5)','inputmode="numeric" placeholder="5"')+f('sp','קצב ממוצע במתגברת','placeholder="3:25"')+'</div><div class="fchips">'+chipsHTML(it.id,'sf',['קלילים','כבדים','משהו תפס'],v.sf)+'</div>';
    x='<div class="lsub">איך הרגשת?</div>'+chipsHTML(it.id,'feel',FEEL,v.feel);

    x='<div class="lsub">איך הרגשת?</div>'+chipsHTML(it.id,'feel',FEEL,v.feel);
  }else{
    g='<div class="lgrid">'+f('dur','משך (דק׳)','inputmode="numeric" placeholder="'+it.min+'"')+f('rpe','RPE ממוצע (1–10)','inputmode="decimal" placeholder="7"')+'</div>';

/* ---------- history + last workout ---------- */
function logEntries(){
  var res=[];
  for(var o=LAST;o>=0;o--){
    var d=dateOf(o),k=key(d),lg=S.log[k],dn=S.done[k]||{},p=dayPlan(d),seen={};
    sessList(p).forEach(function(it){var v=lg&&lg[it.id];if(hasData(v)||dn[it.id]){seen[it.id]=1;res.push({k:k,d:d,it:it,v:v||{},wi:it.wi!=null?it.wi:p.wi,done:!!dn[it.id]});}});
    if(lg)Object.keys(lg).forEach(function(id){if(!seen[id]&&hasData(lg[id]))res.push({k:k,d:d,it:{id:id,title:NAMES[id]||id,kind:'x',cls:'s'},v:lg[id],wi:p.wi,orphan:true});});
  }
  return res;
}
function entryCoach(e){return e.orphan?null:coachFor(e.it,e.k,e.wi);}

  var cur='',first=true;

    var cf=entryCoach(e),stat=cf?cf.stat:(e.done&&!hasData(e.v)?'בוצע':'');

    if(cf)first=false;

  return fb(h+'</div></div>');

/* ---------- week check + moves ---------- */
function warnList(){
  var P=composed(),W=[];
  function T(p){var t={Q:0,L:0,U1:0,U2:0,LG:0,AT:0,n:0};sessList(p).forEach(function(s){if(t[s.id]!=null)t[s.id]=1;if(s.id!=='MOB'&&s.id!=='ROLL'&&s.id!=='YG')t.n++;});return t;}
  for(var i=0;i<=LAST;i++){
    var t=T(P[i]),dk=key(P[i].d),u=i<LAST?T(P[i+1]):null,dl=fmtDay(P[i].d);
    if(t.U1&&t.U2)W.push({k:'uu0|'+dk,t:'שני אימוני פלג גוף עליון באותו יום ('+dl+').'});
    if(u&&((t.U1&&u.U2)||(t.U2&&u.U1)))W.push({k:'uu1|'+dk,t:'פירמידה ופלג גוף עליון ביומיים רצופים ('+dl+' והיום שאחריו). הידיים והחזה לא מספיקים להתאושש.'});
    if(t.LG&&(t.Q||t.L))W.push({k:'lq0|'+dk,t:'רגליים כבדות באותו יום עם '+(t.Q?'ריצת איכות':'הריצה הארוכה')+' ('+dl+').'});
    if(u&&t.LG&&(u.Q||u.L))W.push({k:'lq1|'+dk,t:'רגליים כבדות ב'+dl+', יום לפני '+(u.Q?'ריצת איכות':'הריצה הארוכה')+'. הרגליים לא יהיו רעננות.'});
    if(u&&t.Q&&u.LG)W.push({k:'ql1|'+dk,t:'רגליים כבדות מיד אחרי ריצת איכות ('+dl+' והיום שאחריו). עדיף רווח של יומיים.'});
    if(t.Q&&t.L)W.push({k:'ql0|'+dk,t:'איכות וריצה ארוכה באותו יום ('+dl+').'});
    if(u&&((t.Q&&u.L)||(t.L&&u.Q)))W.push({k:'ql2|'+dk,t:'ריצת איכות וריצה ארוכה ביומיים רצופים ('+dl+' והיום שאחריו). הארוכה תבוא עם רגליים עייפות.'});
    if(u&&t.AT&&u.Q)W.push({k:'aq1|'+dk,t:'אתלטיקה ב'+dl+', יום לפני ריצת איכות. קלינים וברפיז מעייפים את הרגליים.'});
    if(t.n>=3)W.push({k:'busy|'+dk,t:'יום עמוס: '+t.n+' אימונים ב'+dl+'.'});
  }
  return W;
}
function warnWith(pl){var old=S.place;S.place=pl;_pc=null;var w=warnList();S.place=old;_pc=null;return w;}

function migrate(id,a,b){['log','done'].forEach(function(f){var s=S[f];if(s[a]&&s[a][id]!=null){s[b]=s[b]||{};s[b][id]=s[a][id];delete s[a][id];if(!Object.keys(s[a]).length)delete s[a];}});}

function openMove(id,from){mvS={id:id,from:from,cur:key(dateOf(viewKey)),stage:'pick',wk:clamp(Math.floor(viewKey/7),0,3)};drawSheet();}
function movePlan(m){
  var it=itemOn(m.cur,m.id);if(!it)return null;
  var np=Object.assign({},S.place||{}),ops=[];
  setPlace(np,it,m.to);ops.push([it.id,m.cur,m.to]);
  if(m.swap){var x=itemOn(m.to,m.swap);if(!x)return null;setPlace(np,x,m.cur);ops.push([x.id,m.to,m.cur]);}
  return{np:np,ops:ops,it:it};
}

  if(m.stage==='pick'){
    h+='<div class="small muted">בחר יום חדש. הזזה חופשית, והאפליקציה תבדוק את השבוע ותזהיר אם נוצר מבנה גרוע.</div><div class="chips">'+WEEKS.map(function(w,i){return '<button class="chip" data-act="mvwk" data-v="'+i+'" aria-pressed="'+(i===m.wk)+'">שבוע '+w.n+'</button>';}).join('')+'</div><div class="stack" style="gap:8px">';
    for(var i=0;i<7;i++){var o=m.wk*7+i;if(o>LAST)break;var d=dateOf(o),dk=key(d),p=dayPlan(d);

    ex.forEach(function(x){var clash=sessList(dayPlan(dateFromKey(m.cur))).some(function(y2){return y2.id===x.id&&y2.id!==m.id;});h+='<button class="optb" data-act="mvopt" data-v="'+x.id+'" '+(clash?'disabled':'')+'>להחליף עם '+titleOfIt(x)+' (הוא יעבור ל'+fmtShort(m.cur)+')</button>';});

function deepMerge(a,b){
  var r=Object.assign({},a);
  Object.keys(b).forEach(function(k){var x=b[k],y=r[k];
    if(x&&typeof x==='object'&&!Array.isArray(x))r[k]=deepMerge(y&&typeof y==='object'?y:{},x);
    else if(x!==''&&x!=null)r[k]=x;else if(!(k in r))r[k]=x;});
  return r;
}
function importData(txt){
  try{var o=JSON.parse(txt);if(!o||typeof o!=='object'||Array.isArray(o))return false;
    var okk=['ci','done','load','log','place'].some(function(f){return o[f]&&typeof o[f]==='object';});if(!okk)return false;
    try{localStorage.setItem(STORE+'-prev',JSON.stringify(S));}catch(e){}
    ['ci','done','load','log','longDay','place'].forEach(function(f){var a=S[f]&&typeof S[f]==='object'?S[f]:{},b=o[f]&&typeof o[f]==='object'&&!Array.isArray(o[f])?o[f]:{};S[f]=deepMerge(a,b);});
    if(o.runs===3||o.runs===4)S.runs=o.runs;if(o.lthr>=140&&o.lthr<=200)S.lthr=Math.round(o.lthr);
    if(o.created&&(!S.created||o.created<S.created))S.created=o.created;
    save();render();return true;}catch(e){return false;}
}
